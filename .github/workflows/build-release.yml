      release_tag: ${{ steps.resolve.outputs.release_tag }}
      patch_digest: ${{ steps.resolve.outputs.patch_digest }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      runner: ${{ steps.resolve.outputs.runner }}
      node_version: ${{ steps.resolve.outputs.node_version }}
      pnpm_version: ${{ steps.resolve.outputs.pnpm_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Select new upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python scripts/upstream.py --tag "$UPSTREAM_TAG"
