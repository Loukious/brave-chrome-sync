name: Check automation and patch base
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Exercise update staging, integrity and activation offline
        run: dotnet run --project tests/updater/Updater.Tests.csproj -p:PublishSingleFile=false -p:PublishTrimmed=false
      - name: Check Windows checkpoint integrity and archive round trip
        run: python -m unittest discover -s tests -p test_checkpoint.py -v
      - name: Exercise interrupted checkpoint download and checksum failures
        run: python -m unittest discover -s tests -p test_download_checkpoint.py -v
      - name: Create a checkpoint spanning multiple download ranges
        run: python tests/checkpoint_artifact_fixture.py create
      - name: Upload checkpoint transport fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkpoint-987654
          path: work/checkpoint-transport-fixture/upload/*
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - name: Verify production downloader against real GitHub artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/checkpoint_artifact_fixture.py download
      - name: Exercise real Windows build timeout and process ownership
        run: python -m unittest discover -s tests -p test_build_process.py -v
      - name: Build fixture browser and real installer
        shell: pwsh
        run: |
          dotnet build tests/fixture/Fixture.csproj -c Release -o work/fixture
          if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed' }
          python tests/installer_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install, launch through shortcuts and preserve profile
        shell: pwsh
        run: ./tests/installer.test.ps1
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check generated job graph
        run: python scripts/generate_workflow.py --check
      - name: Check release selection and fail-closed publishing
        run: python -m unittest discover -s tests -v
      - name: Check updater installation and failure recovery offline
        shell: pwsh
        run: ./tests/updater.test.ps1
      - name: Replay original patch set
        shell: bash
        run: |
          tag=$(python -c 'import json; print(json.load(open("config.json"))["patch_base_tag"])')
          sha=$(python -c 'import json; print(json.load(open("config.json"))["patch_base_commit"])')
          python scripts/prepare.py --root "$RUNNER_TEMP/base-check" --tag "$tag" --sha "$sha" --patch-only
      - name: Replay patches against the newest configured upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/upstream.py --repository '' > "$RUNNER_TEMP/latest-upstream.json"
          tag=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/latest-upstream.json"))["upstream_tag"])')
          sha=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/latest-upstream.json"))["upstream_sha"])')
          python scripts/prepare.py --root "$RUNNER_TEMP/latest-check" --tag "$tag" --sha "$sha" --patch-only
