name: Windows checkpoint stage
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      stage:
        type: number
        required: true
      previous_stage:
        type: number
        default: 0
      checkpoint_run_id:
        type: string
        default: ''
      finished:
        type: string
        default: 'false'
      upstream_tag:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      channel:
        type: string
        required: true
      runner:
        type: string
        required: true
      node_version:
        type: string
        required: true
      pnpm_version:
        type: string
        required: true
    secrets:
      BRAVE_SERVICES_KEY:
        required: true
    outputs:
      finished:
        value: ${{ inputs.finished == 'true' && 'true' || jobs.stage.outputs.finished }}
permissions:
  contents: read
  actions: write
jobs:
  already-finished:
    # Keep the called workflow successful so later jobs and publication run
    # when an earlier compilation stage finished ahead of the 16-stage limit.
    if: inputs.finished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Compilation already finished in an earlier stage.'
  stage:
    if: inputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        shell: pwsh
        run: |
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
      - name: Set up Windows toolchain
        shell: pwsh
        run: ./scripts/runner-setup.ps1
      - name: Check recovery checkpoint compatibility
        id: recovery
        if: inputs.checkpoint_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
        run: |
          python scripts/resume_checkpoint.py --run-id $env:CHECKPOINT_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Checkpoint recovery is incompatible' }
      - name: Download previous checkpoint
        if: inputs.mode == 'compile'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: checkpoint-${{ inputs.previous_stage }}
          path: checkpoint
          github-token: ${{ github.token }}
          run-id: ${{ inputs.checkpoint_run_id || github.run_id }}
          digest-mismatch: error
      - name: Prepare or continue compilation
        id: build
        shell: pwsh
        env:
          BUILD_MODE: ${{ inputs.mode }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
          BRAVE_SERVICES_KEY: ${{ secrets.BRAVE_SERVICES_KEY }}
          RESUME_COMMIT: ${{ steps.recovery.outputs.commit }}
        run: |
          python scripts/stage.py --mode $env:BUILD_MODE --tag $env:UPSTREAM_TAG --sha $env:UPSTREAM_SHA --release-tag $env:RELEASE_TAG --channel $env:CHANNEL --resume-commit "$env:RESUME_COMMIT"
          if ($LASTEXITCODE -ne 0) { throw "Build stage failed: $LASTEXITCODE" }
      - name: Upload next checkpoint
        if: steps.build.outputs.finished == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checkpoint-${{ inputs.stage }}
          path: |
            checkpoint/state.tar.gz
            checkpoint/state-manifest.json
          compression-level: 0
          retention-days: 5
          overwrite: true
          if-no-files-found: error
      - name: Upload completed browser
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-release
          path: dist/*
          compression-level: 0
          retention-days: 5
          overwrite: true
          if-no-files-found: error
      - name: Retain the newest two checkpoints after successful handoff
        if: inputs.mode == 'compile' && inputs.checkpoint_run_id == '' && inputs.previous_stage >= 1
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_STAGE: ${{ inputs.previous_stage }}
        run: |
          $olderStage = [int]$env:PREVIOUS_STAGE - 1
          python scripts/cleanup_artifacts.py --name "checkpoint-$olderStage" --best-effort
          if ($LASTEXITCODE -ne 0) { throw 'Old checkpoint cleanup failed' }
