name: Windows checkpoint stage
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      stage:
        type: number
        required: true
      previous_stage:
        type: number
        default: 0
      finished:
        type: string
        default: 'false'
      upstream_tag:
        type: string
        required: true
      upstream_sha:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      channel:
        type: string
        required: true
      runner:
        type: string
        required: true
      node_version:
        type: string
        required: true
      pnpm_version:
        type: string
        required: true
    outputs:
      finished:
        value: ${{ inputs.finished == 'true' && 'true' || jobs.stage.outputs.finished }}
permissions:
  contents: read
  actions: write
jobs:
  stage:
    if: inputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    outputs:
      finished: ${{ steps.build.outputs.finished }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}
      - name: Install pnpm
        env:
          PNPM_VERSION: ${{ inputs.pnpm_version }}
        shell: pwsh
        run: |
          npm install --global "pnpm@$env:PNPM_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
      - name: Set up Windows toolchain
        shell: pwsh
        run: ./scripts/runner-setup.ps1
      - name: Download previous checkpoint
        if: inputs.mode == 'compile'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checkpoint-${{ inputs.previous_stage }}
          path: checkpoint
      - name: Prepare or continue compilation
        id: build
        shell: pwsh
        env:
          BUILD_MODE: ${{ inputs.mode }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python scripts/stage.py --mode $env:BUILD_MODE --tag $env:UPSTREAM_TAG --sha $env:UPSTREAM_SHA --release-tag $env:RELEASE_TAG --channel $env:CHANNEL
          if ($LASTEXITCODE -ne 0) { throw "Build stage failed: $LASTEXITCODE" }
      - name: Upload next checkpoint
        if: steps.build.outputs.finished == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkpoint-${{ inputs.stage }}
          path: checkpoint/state.tar.gz
          compression-level: 0
          retention-days: 5
          overwrite: true
          if-no-files-found: error
      - name: Upload completed browser
        if: steps.build.outputs.finished == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-release
          path: dist/*
          compression-level: 0
          retention-days: 5
          overwrite: true
          if-no-files-found: error
      - name: Remove consumed checkpoint after successful handoff
        if: inputs.mode == 'compile'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_STAGE: ${{ inputs.previous_stage }}
        run: python scripts/cleanup_artifacts.py --name "checkpoint-$env:PREVIOUS_STAGE"
